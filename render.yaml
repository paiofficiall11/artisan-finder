# Render Blueprint — Artisan Finder (SD-06)
# Backend: Node Web Service · Frontend: Static Site with SPA rewrite
# Secret values (sync: false) are set in the Render dashboard or via the API.

services:
  - type: web
    name: artisan-finder-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APPWRITE_ENDPOINT
        sync: false
      - key: APPWRITE_PROJECT_ID
        sync: false
      - key: APPWRITE_API_KEY
        sync: false
      - key: APPWRITE_DATABASE_ID
        value: artisan_finder
      - key: APPWRITE_PROFILES_COLLECTION_ID
        value: profiles
      - key: APPWRITE_BOOKINGS_COLLECTION_ID
        value: bookings
      - key: APPWRITE_AVATARS_BUCKET_ID
        value: avatars
      - key: APPWRITE_PORTFOLIO_BUCKET_ID
        value: portfolio
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: artisan-finder-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # react-router-dom needs every path to serve index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_APPWRITE_ENDPOINT
        sync: false
      - key: VITE_APPWRITE_PROJECT_ID
        sync: false
